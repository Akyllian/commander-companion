# Runs the full quality gate on every push and pull request (D-017).
# Deployment is intentionally not configured until the hosting choice is made.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (package.json engines) and current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # typecheck + lint + tests with 100% coverage on src/game and src/settings + production build
      - run: npm run verify
      - name: Build served from a subfolder (GitHub Pages layout)
        run: npx vite build
        env:
          BASE_PATH: /commander-companion/
      - name: Check the subfolder build
        run: |
          grep -q '"start_url":"/commander-companion/"' dist/manifest.webmanifest
          grep -q 'createHandlerBoundToURL("/commander-companion/index.html")' dist/sw.js
